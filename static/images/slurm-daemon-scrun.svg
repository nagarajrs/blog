<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'Space Grotesk','Segoe UI',sans-serif">
  <defs>
    <marker id="scArrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a9a9a"/>
    </marker>
    <marker id="scArrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8961e"/>
    </marker>
    <marker id="scArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a5e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="420" fill="#0a0a0a"/>
  <rect x="1" y="1" width="898" height="418" rx="16" fill="none" stroke="#1e1e1e"/>

  <!-- docker/podman -->
  <rect x="60" y="60" width="200" height="60" rx="10" fill="#141414" stroke="#282828" stroke-width="1.6"/>
  <text x="160" y="96" fill="#f0f0f0" font-size="15" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">docker / podman</text>

  <path d="M260,90 L340,90" fill="none" stroke="#4a9a9a" stroke-width="1.8" marker-end="url(#scArrowTeal)"/>
  <text x="300" y="75" fill="#888888" font-size="10" text-anchor="middle">OCI calls</text>

  <!-- scrun -->
  <rect x="340" y="60" width="180" height="60" rx="10" fill="#0e1616" stroke="#4a9a9a" stroke-width="2"/>
  <text x="430" y="96" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">scrun</text>

  <path d="M430,120 L430,180" fill="none" stroke="#e8961e" stroke-width="1.8" marker-end="url(#scArrowAmber)"/>
  <text x="450" y="155" fill="#888888" font-size="10">submits as a job</text>

  <!-- slurmctld -->
  <rect x="340" y="180" width="180" height="60" rx="10" fill="#171207" stroke="#e8961e" stroke-width="2"/>
  <text x="430" y="216" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">slurmctld</text>

  <path d="M430,240 L430,300" fill="none" stroke="#4c8a5e" stroke-width="1.8" marker-end="url(#scArrowGreen)"/>

  <!-- slurmd -->
  <rect x="340" y="300" width="180" height="60" rx="10" fill="#0f1a12" stroke="#4c8a5e" stroke-width="2"/>
  <text x="430" y="336" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">slurmd</text>

  <!-- scrun.lua -->
  <path d="M520,330 L640,330" fill="none" stroke="#4a9a9a" stroke-width="1.6" stroke-dasharray="4,4" marker-start="url(#scArrowTeal)" marker-end="url(#scArrowTeal)"/>
  <rect x="640" y="300" width="200" height="60" rx="10" fill="#0e1616" stroke="#4a9a9a" stroke-width="1.6" stroke-dasharray="6,5"/>
  <text x="740" y="336" fill="#f0f0f0" font-size="15" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">scrun.lua</text>

  <text x="740" y="385" fill="#666666" font-size="11" text-anchor="middle">stages container data to and from the compute node</text>

  <text x="430" y="400" fill="#666666" font-size="12" text-anchor="middle">from docker's view, nothing changed; from Slurm's view, it's just another job</text>
</svg>
