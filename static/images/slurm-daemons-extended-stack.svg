<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="'Space Grotesk','Segoe UI',sans-serif">
  <defs>
    <marker id="esArrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8961e"/>
    </marker>
    <marker id="esArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a5e"/>
    </marker>
    <marker id="esArrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a9a9a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="620" fill="#0a0a0a"/>
  <rect x="1" y="1" width="1078" height="618" rx="16" fill="none" stroke="#1e1e1e"/>

  <!-- core: slurmctld -->
  <rect x="460" y="60" width="160" height="60" rx="10" fill="#171207" stroke="#e8961e" stroke-width="2"/>
  <text x="540" y="96" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">slurmctld</text>

  <!-- core: slurmd -->
  <rect x="460" y="200" width="160" height="60" rx="10" fill="#0f1a12" stroke="#4c8a5e" stroke-width="2"/>
  <text x="540" y="236" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">slurmd</text>

  <line x1="540" y1="120" x2="540" y2="200" stroke="#4c8a5e" stroke-width="1.8" marker-start="url(#esArrowAmber)" marker-end="url(#esArrowGreen)"/>

  <!-- slurmstepd hanging off slurmd -->
  <rect x="460" y="330" width="160" height="60" rx="10" fill="#0e1616" stroke="#4a9a9a" stroke-width="1.6" stroke-dasharray="6,5"/>
  <text x="540" y="366" fill="#f0f0f0" font-size="15" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">slurmstepd</text>

  <line x1="540" y1="260" x2="540" y2="330" stroke="#4a9a9a" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#esArrowTeal)"/>
  <text x="540" y="410" fill="#888888" font-size="11" text-anchor="middle">forked per job step, exits when it ends</text>

  <!-- sackd -->
  <rect x="90" y="60" width="180" height="60" rx="10" fill="#0e1616" stroke="#4a9a9a" stroke-width="1.6"/>
  <text x="180" y="96" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">sackd</text>
  <text x="180" y="140" fill="#888888" font-size="11" text-anchor="middle">auth for login nodes</text>
  <text x="180" y="155" fill="#888888" font-size="11" text-anchor="middle">(no full slurmd needed)</text>

  <path d="M270,90 L460,90" fill="none" stroke="#4a9a9a" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#esArrowTeal)"/>

  <!-- slurmrestd -->
  <rect x="810" y="60" width="180" height="60" rx="10" fill="#0e1616" stroke="#4a9a9a" stroke-width="1.6"/>
  <text x="900" y="96" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">slurmrestd</text>
  <text x="900" y="140" fill="#888888" font-size="11" text-anchor="middle">REST API</text>
  <text x="900" y="155" fill="#888888" font-size="11" text-anchor="middle">(JWT or local auth)</text>

  <path d="M810,90 L620,90" fill="none" stroke="#4a9a9a" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#esArrowTeal)"/>

  <!-- scrun -->
  <rect x="810" y="330" width="180" height="60" rx="10" fill="#0e1616" stroke="#4a9a9a" stroke-width="1.6"/>
  <text x="900" y="366" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">scrun</text>
  <text x="900" y="410" fill="#888888" font-size="11" text-anchor="middle">containers as jobs</text>
  <text x="900" y="425" fill="#888888" font-size="11" text-anchor="middle">(docker / podman via OCI)</text>

  <path d="M810,360 L620,105" fill="none" stroke="#4a9a9a" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#esArrowTeal)"/>

  <text x="540" y="480" fill="#666666" font-size="12" text-anchor="middle">plus the usual srun / sinfo / squeue clients talking straight to slurmctld</text>

</svg>
