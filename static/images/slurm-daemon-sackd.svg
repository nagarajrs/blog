<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="'Space Grotesk','Segoe UI',sans-serif">
  <defs>
    <marker id="skArrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a9a9a"/>
    </marker>
    <marker id="skArrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4c8a5e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="340" fill="#0a0a0a"/>
  <rect x="1" y="1" width="898" height="338" rx="16" fill="none" stroke="#1e1e1e"/>

  <!-- slurmctld -->
  <rect x="360" y="30" width="180" height="60" rx="10" fill="#171207" stroke="#e8961e" stroke-width="2"/>
  <text x="450" y="66" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">slurmctld</text>

  <!-- login node / sackd -->
  <text x="180" y="145" fill="#888888" font-size="12" text-anchor="middle" letter-spacing="1">LOGIN NODE</text>
  <rect x="80" y="160" width="200" height="60" rx="10" fill="#0e1616" stroke="#4a9a9a" stroke-width="2"/>
  <text x="180" y="196" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">sackd</text>
  <text x="180" y="245" fill="#888888" font-size="11" text-anchor="middle">auth only, no job execution</text>

  <path d="M280,175 L450,90" fill="none" stroke="#4a9a9a" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#skArrowTeal)"/>

  <!-- compute node / slurmd -->
  <text x="720" y="145" fill="#888888" font-size="12" text-anchor="middle" letter-spacing="1">COMPUTE NODE</text>
  <rect x="620" y="160" width="200" height="60" rx="10" fill="#0f1a12" stroke="#4c8a5e" stroke-width="2"/>
  <text x="720" y="196" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">slurmd</text>
  <text x="720" y="245" fill="#888888" font-size="11" text-anchor="middle">auth, plus full job execution</text>

  <path d="M620,175 L450,90" fill="none" stroke="#4c8a5e" stroke-width="1.6" stroke-dasharray="4,4" marker-end="url(#skArrowGreen)"/>

  <text x="450" y="300" fill="#666666" font-size="12" text-anchor="middle">both trust slurmctld through the same MUNGE-backed authentication</text>
</svg>
