<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Space Grotesk','Segoe UI',sans-serif">
  <defs>
    <marker id="srArrowTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a9a9a"/>
    </marker>
    <marker id="srArrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8961e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="380" fill="#0a0a0a"/>
  <rect x="1" y="1" width="898" height="378" rx="16" fill="none" stroke="#1e1e1e"/>

  <!-- HTTP client -->
  <rect x="40" y="140" width="190" height="60" rx="10" fill="#141414" stroke="#282828" stroke-width="1.6"/>
  <text x="135" y="176" fill="#f0f0f0" font-size="15" font-weight="700" text-anchor="middle">Portal / dashboard</text>
  <text x="135" y="215" fill="#888888" font-size="11" text-anchor="middle">HTTP client</text>

  <path d="M230,170 L340,170" fill="none" stroke="#4a9a9a" stroke-width="1.8" marker-end="url(#srArrowTeal)"/>

  <!-- slurmrestd -->
  <rect x="340" y="140" width="200" height="60" rx="10" fill="#0e1616" stroke="#4a9a9a" stroke-width="2"/>
  <text x="440" y="176" fill="#f0f0f0" font-size="16" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">slurmrestd</text>

  <path d="M540,170 L660,170" fill="none" stroke="#e8961e" stroke-width="1.8" marker-end="url(#srArrowAmber)"/>

  <!-- slurmctld / slurmdbd -->
  <rect x="660" y="140" width="200" height="60" rx="10" fill="#171207" stroke="#e8961e" stroke-width="2"/>
  <text x="760" y="171" fill="#f0f0f0" font-size="15" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono',monospace">slurmctld</text>
  <text x="760" y="188" fill="#888888" font-size="11" text-anchor="middle">/ slurmdbd</text>

  <!-- auth modes below -->
  <line x1="400" y1="200" x2="400" y2="250" stroke="#4a9a9a" stroke-width="1.4" stroke-dasharray="4,4"/>
  <line x1="480" y1="200" x2="480" y2="250" stroke="#4a9a9a" stroke-width="1.4" stroke-dasharray="4,4"/>

  <rect x="300" y="250" width="190" height="55" rx="8" fill="#141414" stroke="#282828"/>
  <text x="395" y="272" fill="#f0f0f0" font-size="13" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono',monospace">rest_auth/local</text>
  <text x="395" y="290" fill="#888888" font-size="11" text-anchor="middle">UNIX socket, matching UID</text>

  <rect x="500" y="250" width="190" height="55" rx="8" fill="#141414" stroke="#282828"/>
  <text x="595" y="272" fill="#f0f0f0" font-size="13" font-weight="600" text-anchor="middle" font-family="'JetBrains Mono',monospace">rest_auth/jwt</text>
  <text x="595" y="290" fill="#888888" font-size="11" text-anchor="middle">TCP or UNIX, token header</text>

  <text x="440" y="340" fill="#666666" font-size="12" text-anchor="middle">listen mode (own socket) or inetd mode (systemd socket activation)</text>
</svg>
